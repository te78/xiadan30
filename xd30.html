<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>抖音风格商品详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; font-family: "PingFang SC", sans-serif; }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 15px;
            left: 10px;
            width: 30px;
            height: 30px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            color: white;
            text-align: center;
            line-height: 30px;
            z-index: 100;
        }

        /* 商品主图区 */
        .product-banner {
            position: relative;
            height: 65vh;
            background: linear-gradient(45deg, #ff3c41, #ff6b6b);
        }
        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            color: white;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
        }

        /* 活动优惠区 */
        .coupon-box {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .coupon-tag {
            display: inline-block;
            padding: 4px 8px;
            background: #ffe8e9;
            color: #ff3c41;
            border-radius: 4px;
            margin-right: 8px;
        }

        /* 商品评价 */
        .review-box {
            background: white;
            margin: 10px;
            padding: 15px;
            border-radius: 8px;
        }
        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        /* 商品详情标题 */
        .detail-title {
            text-align: center;
            padding: 20px 0;
            font-size: 18px;
        }

        /* 相关商品 */
        .related-products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 0 10px;
        }
        .related-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
        }

        /* 悬浮操作按钮 */
        .action-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
        }
        .buy-btn {
            background: #ff3366;
            color: white;
            margin-right: 10px;
        }
        .service-btn {
            background: #f0f0f0;
            color: #333;
        }

.review-box {
    /* 其他样式，如背景、边距等 */
}

.review-content {
    display: flex;
    align-items: center;
}

.user-info {
    /* 头像和用户详情的布局样式已在HTML内联样式中定义，这里不再重复 */
}

.user-details {
    /* 用户详情的内部布局样式，如边距、字体等 */
}

.review-image {
    max-width: 30%; /* 限制好评图的最大宽度 */
    border-radius: 6px; /* 保持圆角效果 */
    margin-left: 20px; /* 与用户信息分隔开 */
}

.review-box {
    position: relative; /* 确保内部绝对定位元素能够正确参考 */
    /* 其他样式，如背景、边距等 */
}

.review-title {
    position: absolute;
    top: 10px;
    left: 10px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 14px; /* 根据实际需求调整字体大小 */
    font-weight: bold; /* 可选：增加字体粗细以突出标题 */
}

.review-content {
    display: flex;
    align-items: center;
    padding-top: 30px; /* 为标题留出空间 */
}


.avatar-with-tags {
    display: flex;
    align-items: center;
}

.tag {
    background-color: #f0f0f0; /* 默认背景色，可以根据实际需求调整 */
    padding: 2px 5px;
    border-radius: 3px;
    margin-bottom: 5px;
    color: #333; /* 标签文字颜色 */
    font-size: 12px; /* 标签文字大小 */


.review-tags-container {
    position: absolute;
    top: 40px;
    left: 10px;
    display: flex;
    align-items: center;
    background-color: #ffc0cb;
    padding: 5px 10px;
    border-radius: 4px;
}

.tag {
    margin-right: 10px; /* 除了最后一个标签外，其他标签右侧有外边距 */
    background-color: #ffffff; /* 白色背景 */
    padding: 2px 5px;
    border: 1px solid #ff69b4; /* 浅粉色边框 */
    border-radius: 3px;
    color: #333; /* 标签文字颜色 */
    font-size: 12px; /* 标签文字大小 */
}
.review-separator {
    position: absolute;
    top: 70px; /* 根据实际布局调整，确保分割线位于标签下方 */
    left: 0;
    right: 0;
    border-top: 1px solid #e0e0e0; /* 浅色灰色分割线 */
}
